services:
  mongo-social:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo/mongo-social:/data/db
      - ./init/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    command: mongod --auth
    container_name: mongo-social
    restart: unless-stopped
    networks:
      - node-social

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    container_name: redis-social
    volumes:
      - ./redis/dаta:/root/redis
      # - /path/to/local/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=root
      - REDIS_PORT=6379
      - REDIS_DATABASES=16
networks:
  node-social:
    driver: bridge
